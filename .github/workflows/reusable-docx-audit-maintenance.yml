name: Reusable DocX Pull Request Audit Maintenance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions: {}

jobs:
  plan:
    name: Plan Pull Request Audit Maintenance
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      pull-requests: write
    outputs:
      items_json: ${{ steps.plan-maintenance.outputs.items_json }}

    steps:
      - name: Derive integration helper source
        id: integration-source
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          repository="${WORKFLOW_REF%%/.github/workflows/*}"
          if [ -z "$repository" ] || [ "$repository" = "$WORKFLOW_REF" ]; then
            echo "::error::Reusable workflow repository could not be derived."
            exit 1
          fi
          if ! printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Reusable workflow SHA is invalid."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout integration helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.integration-source.outputs.repository }}
          ref: ${{ steps.integration-source.outputs.ref }}
          path: docx-integration-source
          token: ""
          persist-credentials: false

      - name: Plan maintenance
        id: plan-maintenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node docx-integration-source/scripts/docx-audit-workflow-guards.mjs plan-maintenance

  refresh:
    name: Refresh Pull Request Audit Artifact
    runs-on: ubuntu-24.04
    needs:
      - plan
    if: needs.plan.outputs.items_json != '[]'
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items_json) }}
    permissions:
      actions: write
      pull-requests: write

    steps:
      - name: Derive integration helper source
        id: integration-source
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          repository="${WORKFLOW_REF%%/.github/workflows/*}"
          if [ -z "$repository" ] || [ "$repository" = "$WORKFLOW_REF" ]; then
            echo "::error::Reusable workflow repository could not be derived."
            exit 1
          fi
          if ! printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Reusable workflow SHA is invalid."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout integration helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.integration-source.outputs.repository }}
          ref: ${{ steps.integration-source.outputs.ref }}
          path: docx-integration-source
          token: ""
          persist-credentials: false

      - name: Download old Pull Request Audit Artifact
        id: download-old-artifact
        if: matrix.item.operation == 'refresh'
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OLD_ARTIFACT_ID: ${{ matrix.item.old_artifact_id }}
          ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/docx-maintenance-artifact
        run: node docx-integration-source/scripts/docx-audit-workflow-guards.mjs download-maintenance-artifact

      - name: Upload replacement Pull Request Audit Artifact
        id: upload-replacement
        if: steps.download-old-artifact.outputs.downloaded == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: ${{ matrix.item.artifact_name }}
          path: ${{ steps.download-old-artifact.outputs.content_dir }}
          retention-days: 30
          compression-level: 0
          overwrite: false
          if-no-files-found: error

      - name: Validate replacement Pull Request Audit Artifact
        id: validate-replacement
        if: steps.upload-replacement.outcome == 'success'
        shell: bash
        continue-on-error: true
        env:
          UPLOAD_OUTCOME: ${{ steps.upload-replacement.outcome }}
          OLD_ARTIFACT_ID: ${{ matrix.item.old_artifact_id }}
          NEW_ARTIFACT_ID: ${{ steps.upload-replacement.outputs.artifact-id }}
          NEW_ARTIFACT_URL: ${{ steps.upload-replacement.outputs.artifact-url }}
          ARTIFACT_NAME: ${{ matrix.item.artifact_name }}
        run: node docx-integration-source/scripts/docx-audit-workflow-guards.mjs validate-maintenance-upload

      - name: Refresh current report comment
        id: refresh-comment
        if: matrix.item.is_current_report == true && steps.validate-replacement.outputs.accepted == 'true'
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ matrix.item.pull_request_number }}
          AUDITED_SHA: ${{ matrix.item.audited_sha }}
          REPORT_FORMAT: ${{ matrix.item.report_format }}
          REPORT_URL: ${{ steps.validate-replacement.outputs.report_url }}
        run: node docx-integration-source/scripts/docx-audit-workflow-guards.mjs refresh-maintenance-comment

      - name: Delete old Pull Request Audit Artifact
        id: delete-old-artifact
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OLD_ARTIFACT_ID: ${{ matrix.item.old_artifact_id }}
          MAINTENANCE_OPERATION: ${{ matrix.item.operation }}
          UPLOAD_ACCEPTED: ${{ steps.validate-replacement.outputs.accepted }}
          IS_CURRENT_REPORT: ${{ matrix.item.is_current_report }}
          COMMENT_UPDATED: ${{ steps.refresh-comment.outputs.updated }}
        run: node docx-integration-source/scripts/docx-audit-workflow-guards.mjs delete-maintenance-artifact
